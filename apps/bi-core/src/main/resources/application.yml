server:
  port: ${PORT:8080}
spring:
  application:
    name: bi-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/bi_agent}
    username: ${SPRING_DATASOURCE_USERNAME:bi_agent}
    password: ${SPRING_DATASOURCE_PASSWORD:bi_agent_dev_only}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:5}
agent:
  url: ${AGENT_URL:http://127.0.0.1:8000}
